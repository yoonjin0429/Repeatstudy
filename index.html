<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 학습 대시보드</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #cbd5e1;
            --input-bg: #f8fafc;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 24px; line-height: 1.5; }
        .container { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

        /* Card Style */
        .card { background-color: var(--card-bg); border-radius: 14px; padding: 24px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        h1, h2, h3 { color: var(--text-main); }

        /* D-Day Section */
        .dday-header { display: flex; justify-content: space-between; align-items: center; }
        .dday-display { font-size: 1.8rem; font-weight: 700; color: var(--primary-color); margin-top: 8px; }
        .dday-input-group { display: flex; gap: 8px; margin-top: 12px; }

        /* Form Controls */
        input[type="text"], input[type="date"], input[type="number"] {
            background-color: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main);
            padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; outline: none; transition: all 0.2s;
        }
        input:focus { border-color: var(--primary-color); background-color: #fff; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        button {
            background-color: var(--primary-color); color: #fff; border: none;
            padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.85rem;
        }
        button:hover { background-color: var(--primary-hover); }
        button.btn-sub { background-color: #e2e8f0; color: var(--text-main); }
        button.btn-sub:hover { background-color: #cbd5e1; }
        button.btn-edit { background-color: #e0e7ff; color: var(--primary-color); padding: 3px 8px; font-size: 0.75rem; border-radius: 6px; }
        button.btn-edit:hover { background-color: var(--primary-color); color: #fff; }
        button.btn-danger { background-color: #fee2e2; color: var(--danger-color); border: 1px solid #fca5a5; padding: 3px 8px; font-size: 0.75rem; border-radius: 6px; }
        button.btn-danger:hover { background-color: var(--danger-color); color: #fff; }

        /* Add Form */
        .add-form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; background: var(--input-bg); padding: 14px; border-radius: 10px; border: 1px solid var(--border-color); }

        /* Drag Handle Style */
        .drag-handle {
            cursor: grab; color: var(--text-sub); font-size: 1.1rem; padding: 0 6px;
            user-select: none; display: flex; align-items: center; justify-content: center;
        }
        .drag-handle:active { cursor: grabbing; color: var(--primary-color); }
        .dragging { opacity: 0.4; border: 2px dashed var(--primary-color) !important; }

        /* Category UI */
        .category-item { margin-top: 24px; background: #fff; border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; transition: background 0.2s; }
        .category-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--bg-color); padding-bottom: 12px; margin-bottom: 12px; }
        .category-title { display: flex; align-items: center; gap: 6px; font-size: 1.3rem; font-weight: 700; color: var(--primary-color); cursor: pointer; user-select: none; }

        /* Book Structure UI */
        .book-item { margin-top: 14px; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; background-color: #fff; transition: background 0.2s; }
        .book-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .book-title-clickable { display: flex; align-items: center; cursor: pointer; user-select: none; font-size: 1.1rem; font-weight: 700; }
        .toggle-icon { display: inline-block; width: 18px; font-size: 0.8rem; color: var(--text-sub); }
        .read-count { background-color: #e0e7ff; color: var(--primary-color); padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; margin-left: 6px; }
        
        .action-group { display: flex; align-items: center; gap: 6px; }

        /* Progress Bar UI */
        .progress-container { margin: 10px 0 14px 0; }
        .progress-info { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; font-weight: 600; }
        .progress-bar-bg { background-color: #e2e8f0; height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { background-color: var(--primary-color); height: 100%; width: 0%; transition: width 0.3s ease; }

        .chapter-item { margin-left: 8px; margin-top: 12px; border-left: 3px solid #cbd5e1; padding-left: 10px; }
        .chapter-header { font-size: 0.95rem; font-weight: 600; color: #334155; display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }

        .topic-item { margin-top: 8px; background-color: var(--input-bg); padding: 8px 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .topic-header { font-size: 0.85rem; color: #475569; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-weight: 500; }

        /* Badges & Checkboxes */
        .badge-done { background-color: #d1fae5; color: #047857; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
        .problem-grid { display: flex; flex-wrap: wrap; gap: 5px; }
        .problem-btn {
            width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border-color);
            background-color: #ffffff; color: var(--text-sub); font-size: 0.75rem; font-weight: 500;
            display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; transition: all 0.15s;
        }
        .problem-btn:hover { border-color: var(--primary-color); color: var(--primary-color); }
        .problem-btn.active { background-color: var(--success-color); color: #fff; border-color: var(--success-color); font-weight: 700; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="dday-header">
            <h2>🎯 목표 D-Day</h2>
            <button class="btn-sub" onclick="toggleDDayInput()">설정 변경</button>
        </div>
        <div id="ddayDisplay" class="dday-display">목표일을 설정해주세요.</div>
        <div id="ddayForm" class="dday-input-group" style="display: none;">
            <input type="text" id="ddayTitle" placeholder="목표 이름 (예: 수능)">
            <input type="date" id="ddayDate">
            <button onclick="saveDDay()">저장</button>
        </div>
    </div>

    <div class="card">
        <h2 style="margin-bottom: 4px;">📚 문제집 학습 관리</h2>
        <p style="color: var(--text-sub); font-size: 0.85rem; margin-bottom: 16px;">
            아이콘(☰)을 꾹 눌러 순서를 이동할 수 있습니다.
        </p>

        <div class="add-form">
            <input type="text" id="inputCategory" placeholder="카테고리 (예: 쎈)" style="flex: 1; min-width: 130px;">
            <input type="text" id="inputBook" placeholder="문제집 명 (예: 수1)" style="flex: 1; min-width: 110px;">
            <input type="text" id="inputChapter" placeholder="대단원 (예: 지수함수)" style="flex: 1; min-width: 110px;">
            <input type="text" id="inputTopic" placeholder="소단원/주제 (예: 지수법칙)" style="flex: 1; min-width: 110px;">
            <input type="number" id="inputCount" placeholder="문항수" style="width: 70px;" min="1">
            <button onclick="addTopic()">추가</button>
        </div>

        <div id="bookTree"></div>
    </div>
</div>

<script>
    let state = {
        dday: JSON.parse(localStorage.getItem('study_dday')) || { title: '', date: '' },
        categories: JSON.parse(localStorage.getItem('study_categories')) || []
    };

    // 기존 데이터 변환 처리
    (function migrateData() {
        const oldBooks = JSON.parse(localStorage.getItem('study_books'));
        if (oldBooks && oldBooks.length > 0) {
            state.categories.push({
                name: '기본 그룹',
                collapsed: false,
                books: oldBooks
            });
            localStorage.removeItem('study_books');
            localStorage.setItem('study_categories', JSON.stringify(state.categories));
        }
    })();

    function saveData() {
        localStorage.setItem('study_dday', JSON.stringify(state.dday));
        localStorage.setItem('study_categories', JSON.stringify(state.categories));
        render();
    }

    /* D-Day Logic */
    function toggleDDayInput() {
        const form = document.getElementById('ddayForm');
        form.style.display = form.style.display === 'none' ? 'flex' : 'none';
    }

    function saveDDay() {
        const title = document.getElementById('ddayTitle').value;
        const date = document.getElementById('ddayDate').value;
        if (!title || !date) return alert('목표와 날짜를 입력해주세요.');
        state.dday = { title, date };
        toggleDDayInput();
        saveData();
    }

    function renderDDay() {
        const display = document.getElementById('ddayDisplay');
        if (!state.dday.date) {
            display.innerText = '목표일을 설정해주세요.';
            return;
        }
        const target = new Date(state.dday.date);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        target.setHours(0, 0, 0, 0);

        const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
        const dDayStr = diff === 0 ? 'D-Day' : diff > 0 ? `D-${diff}` : `D+${Math.abs(diff)}`;
        display.innerText = `${state.dday.title} : ${dDayStr}`;
    }

    /* Logic */
    function addTopic() {
        let catName = document.getElementById('inputCategory').value.trim() || '기본 그룹';
        const bookName = document.getElementById('inputBook').value.trim();
        const chapterName = document.getElementById('inputChapter').value.trim();
        const topicName = document.getElementById('inputTopic').value.trim();
        const count = parseInt(document.getElementById('inputCount').value);

        if (!bookName || !chapterName || !topicName || isNaN(count) || count < 1) {
            return alert('모든 항목을 올바르게 입력해주세요.');
        }

        let category = state.categories.find(c => c.name === catName);
        if (!category) {
            category = { name: catName, collapsed: false, books: [] };
            state.categories.push(category);
        }

        let book = category.books.find(b => b.name === bookName);
        if (!book) {
            book = { name: bookName, readCount: 0, collapsed: false, chapters: [] };
            category.books.push(book);
        }

        let chapter = book.chapters.find(c => c.name === chapterName);
        if (!chapter) {
            chapter = { name: chapterName, topics: [] };
            book.chapters.push(chapter);
        }

        const problems = Array.from({ length: count }, () => false);
        chapter.topics.push({ name: topicName, problems });

        document.getElementById('inputTopic').value = '';
        document.getElementById('inputCount').value = '';

        saveData();
    }

    function toggleCategoryCollapse(catIdx) {
        state.categories[catIdx].collapsed = !state.categories[catIdx].collapsed;
        saveData();
    }

    function toggleBookCollapse(catIdx, bIdx) {
        state.categories[catIdx].books[bIdx].collapsed = !state.categories[catIdx].books[bIdx].collapsed;
        saveData();
    }

    /* Edit Functions */
    function editCategory(catIdx) {
        const cat = state.categories[catIdx];
        const newName = prompt('카테고리 이름을 수정하세요:', cat.name);
        if (newName && newName.trim()) {
            cat.name = newName.trim();
            saveData();
        }
    }

    function editBook(catIdx, bIdx) {
        const book = state.categories[catIdx].books[bIdx];
        const newName = prompt('문제집 이름을 수정하세요:', book.name);
        if (newName && newName.trim()) {
            book.name = newName.trim();
            saveData();
        }
    }

    function editChapter(catIdx, bIdx, cIdx) {
        const chapter = state.categories[catIdx].books[bIdx].chapters[cIdx];
        const newName = prompt('대단원 이름을 수정하세요:', chapter.name);
        if (newName && newName.trim()) {
            chapter.name = newName.trim();
            saveData();
        }
    }

    function editTopic(catIdx, bIdx, cIdx, tIdx) {
        const topic = state.categories[catIdx].books[bIdx].chapters[cIdx].topics[tIdx];
        const newName = prompt('소단원 이름을 수정하세요:', topic.name);
        if (!newName || !newName.trim()) return;

        const newCountStr = prompt('문항 수를 수정하세요:', topic.problems.length);
        const newCount = parseInt(newCountStr);

        if (isNaN(newCount) || newCount < 1) return alert('올바른 문항 수를 입력해주세요.');

        topic.name = newName.trim();
        if (newCount > topic.problems.length) {
            topic.problems.push(...Array(newCount - topic.problems.length).fill(false));
        } else if (newCount < topic.problems.length) {
            topic.problems = topic.problems.slice(0, newCount);
        }

        checkCompletions(catIdx, bIdx);
        saveData();
    }

    /* Problem Toggle & Completion Check */
    function toggleProblem(catIdx, bIdx, cIdx, tIdx, pIdx) {
        const topic = state.categories[catIdx].books[bIdx].chapters[cIdx].topics[tIdx];
        topic.problems[pIdx] = !topic.problems[pIdx];
        checkCompletions(catIdx, bIdx);
        saveData();
    }

    function checkCompletions(catIdx, bIdx) {
        const book = state.categories[catIdx].books[bIdx];
        let totalProblems = 0, solvedProblems = 0;

        book.chapters.forEach(chapter => {
            chapter.topics.forEach(topic => {
                totalProblems += topic.problems.length;
                solvedProblems += topic.problems.filter(p => p).length;
            });
        });

        if (totalProblems > 0 && totalProblems === solvedProblems) {
            book.readCount += 1;
            book.chapters.forEach(chapter => {
                chapter.topics.forEach(topic => topic.problems = topic.problems.map(() => false));
            });
            alert(`🎉 [${book.name}] 모든 문항 완료! ${book.readCount}회독 달성!`);
        }
    }

    /* Delete Functions */
    function deleteCategory(catIdx) {
        if (confirm(`'${state.categories[catIdx].name}' 카테고리와 내부 전체 항목을 삭제하시겠습니까?`)) {
            state.categories.splice(catIdx, 1);
            saveData();
        }
    }

    function deleteBook(catIdx, bIdx) {
        if (confirm('이 문제집 전체를 삭제하시겠습니까?')) {
            state.categories[catIdx].books.splice(bIdx, 1);
            saveData();
        }
    }

    function deleteChapter(catIdx, bIdx, cIdx) {
        if (confirm('이 대단원을 삭제하시겠습니까?')) {
            state.categories[catIdx].books[bIdx].chapters.splice(cIdx, 1);
            saveData();
        }
    }

    function deleteTopic(catIdx, bIdx, cIdx, tIdx) {
        if (confirm('이 소단원을 삭제하시겠습니까?')) {
            const chapter = state.categories[catIdx].books[bIdx].chapters[cIdx];
            chapter.topics.splice(tIdx, 1);
            if (chapter.topics.length === 0) state.categories[catIdx].books[bIdx].chapters.splice(cIdx, 1);
            saveData();
        }
    }

    /* Drag & Drop State */
    let dragSrc = null;

    function handleDragStart(e) {
        dragSrc = this;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', JSON.stringify({
            type: this.dataset.type,
            catIdx: this.dataset.catIdx,
            bIdx: this.dataset.bIdx
        }));
        this.classList.add('dragging');
    }

    function handleDragOver(e) {
        if (e.preventDefault) e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        return false;
    }

    function handleDragEnd(e) {
        this.classList.remove('dragging');
    }

    function handleDrop(e) {
        if (e.stopPropagation) e.stopPropagation();

        const srcData = JSON.parse(e.dataTransfer.getData('text/plain'));
        const targetType = this.dataset.type;

        if (srcData.type !== targetType) return false;

        if (srcData.type === 'category') {
            const fromIdx = parseInt(srcData.catIdx);
            const toIdx = parseInt(this.dataset.catIdx);
            if (fromIdx !== toIdx) {
                const [movedCat] = state.categories.splice(fromIdx, 1);
                state.categories.splice(toIdx, 0, movedCat);
                saveData();
            }
        } else if (srcData.type === 'book') {
            const fromCat = parseInt(srcData.catIdx);
            const fromBook = parseInt(srcData.bIdx);
            const toCat = parseInt(this.dataset.catIdx);
            const toBook = parseInt(this.dataset.bIdx);

            if (fromCat === toCat && fromBook !== toBook) {
                const books = state.categories[fromCat].books;
                const [movedBook] = books.splice(fromBook, 1);
                books.splice(toBook, 0, movedBook);
                saveData();
            }
        }
        return false;
    }

    /* UI Rendering */
    function render() {
        renderDDay();
        const tree = document.getElementById('bookTree');
        tree.innerHTML = '';

        state.categories.forEach((category, catIdx) => {
            const catEl = document.createElement('div');
            catEl.className = 'category-item';
            catEl.draggable = true;
            catEl.dataset.type = 'category';
            catEl.dataset.catIdx = catIdx;

            catEl.addEventListener('dragstart', handleDragStart);
            catEl.addEventListener('dragover', handleDragOver);
            catEl.addEventListener('drop', handleDrop);
            catEl.addEventListener('dragend', handleDragEnd);

            const isCatCollapsed = category.collapsed || false;
            let booksHtml = '';

            category.books.forEach((book, bIdx) => {
                let totalProblems = 0, solvedProblems = 0, chaptersHtml = '';

                book.chapters.forEach((chapter, cIdx) => {
                    let topicsHtml = '', isChapterDone = chapter.topics.length > 0;

                    chapter.topics.forEach((topic, tIdx) => {
                        const topicTotal = topic.problems.length;
                        const topicSolved = topic.problems.filter(p => p).length;
                        totalProblems += topicTotal;
                        solvedProblems += topicSolved;

                        const isTopicDone = topicTotal > 0 && topicTotal === topicSolved;
                        if (!isTopicDone) isChapterDone = false;

                        const gridHtml = topic.problems.map((done, pIdx) => `
                            <div class="problem-btn ${done ? 'active' : ''}" 
                                 onclick="toggleProblem(${catIdx}, ${bIdx}, ${cIdx}, ${tIdx}, ${pIdx})">
                                ${pIdx + 1}
                            </div>
                        `).join('');

                        topicsHtml += `
                            <div class="topic-item">
                                <div class="topic-header">
                                    <div>
                                        <strong>① 주제 ${tIdx + 1}.</strong> ${topic.name}
                                        ${isTopicDone ? '<span class="badge-done">소단원 완료</span>' : ''}
                                    </div>
                                    <div class="action-group">
                                        <button class="btn-edit" onclick="editTopic(${catIdx}, ${bIdx}, ${cIdx}, ${tIdx})">수정</button>
                                        <button class="btn-danger" onclick="deleteTopic(${catIdx}, ${bIdx}, ${cIdx}, ${tIdx})">삭제</button>
                                    </div>
                                </div>
                                <div class="problem-grid">${gridHtml}</div>
                            </div>
                        `;
                    });

                    chaptersHtml += `
                        <div class="chapter-item">
                            <div class="chapter-header">
                                <div>
                                    <span>(${cIdx + 1}) ${chapter.name}</span>
                                    ${isChapterDone ? '<span class="badge-done">대단원 완료</span>' : ''}
                                </div>
                                <div class="action-group">
                                    <button class="btn-edit" onclick="editChapter(${catIdx}, ${bIdx}, ${cIdx})">수정</button>
                                    <button class="btn-danger" onclick="deleteChapter(${catIdx}, ${bIdx}, ${cIdx})">삭제</button>
                                </div>
                            </div>
                            ${topicsHtml}
                        </div>
                    `;
                });

                const percent = totalProblems > 0 ? Math.round((solvedProblems / totalProblems) * 100) : 0;
                const isBookCollapsed = book.collapsed || false;

                booksHtml += `
                    <div class="book-item" draggable="true" data-type="book" data-cat-idx="${catIdx}" data-b-idx="${bIdx}">
                        <div class="book-header">
                            <div style="display: flex; align-items: center;">
                                <span class="drag-handle" title="드래그하여 순서 변경">☰</span>
                                <div class="book-title-clickable" onclick="toggleBookCollapse(${catIdx}, ${bIdx})">
                                    <span class="toggle-icon">${isBookCollapsed ? '▶' : '▼'}</span>
                                    <span>📖 ${bIdx + 1}) ${book.name}</span>
                                    <span class="read-count">${book.readCount}회독</span>
                                </div>
                            </div>
                            <div class="action-group">
                                <button class="btn-edit" onclick="editBook(${catIdx}, ${bIdx})">수정</button>
                                <button class="btn-danger" onclick="deleteBook(${catIdx}, ${bIdx})">삭제</button>
                            </div>
                        </div>

                        <div style="display: ${isBookCollapsed ? 'none' : 'block'};">
                            <div class="progress-container">
                                <div class="progress-info">
                                    <span>진도율 (${solvedProblems} / ${totalProblems} 문항)</span>
                                    <span>${percent}%</span>
                                </div>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill" style="width: ${percent}%;"></div>
                                </div>
                            </div>
                            ${chaptersHtml}
                        </div>
                    </div>
                `;
            });

            catEl.innerHTML = `
                <div class="category-header">
                    <div style="display: flex; align-items: center;">
                        <span class="drag-handle" title="드래그하여 순서 변경">☰</span>
                        <div class="category-title" onclick="toggleCategoryCollapse(${catIdx})">
                            <span class="toggle-icon">${isCatCollapsed ? '▶' : '▼'}</span>
                            <span>📁 ${category.name}</span>
                        </div>
                    </div>
                    <div class="action-group">
                        <button class="btn-edit" onclick="editCategory(${catIdx})">수정</button>
                        <button class="btn-danger" onclick="deleteCategory(${catIdx})">카테고리 삭제</button>
                    </div>
                </div>

                <div style="display: ${isCatCollapsed ? 'none' : 'block'};">
                    ${booksHtml.length > 0 ? booksHtml : '<div style="color: var(--text-sub); font-size: 0.85rem; padding: 10px 0;">문제집이 없습니다. 새로 추가해 보세요!</div>'}
                </div>
            `;

            tree.appendChild(catEl);
        });

        // 문제집 요소들에 이벤트 바인딩
        document.querySelectorAll('.book-item').forEach(bookEl => {
            bookEl.addEventListener('dragstart', handleDragStart);
            bookEl.addEventListener('dragover', handleDragOver);
            bookEl.addEventListener('drop', handleDrop);
            bookEl.addEventListener('dragend', handleDragEnd);
        });
    }

    render();
</script>

</body>
</html>
